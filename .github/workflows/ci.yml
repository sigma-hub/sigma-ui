name: CI

on:
  pull_request:
    branches:
      - main
      - sigma-ui-v2
  push:
    branches:
      - main
      - sigma-ui-v2

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: Typecheck (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - cli
          - shared
          - nuxt
          - lib
          - docs
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm ts:${{ matrix.package }}

  registry:
    name: Registry is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build:registry
      - name: Check for uncommitted registry changes
        run: |
          git add --intent-to-add .
          git diff --exit-code --stat || {
            echo "::error::The generated registry is stale. Run 'pnpm build:registry' and commit the result."
            exit 1
          }

  docs-gen:
    name: API reference is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm docs:check

  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build:cli

  build-docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build

  nuxt:
    name: Nuxt module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build:nuxt
      - run: pnpm --filter sigma-ui-nuxt test
      - name: Add playground components, server-render them, and build the playground
        run: |
          pnpm build:cli
          pnpm --filter sigma-ui-nuxt dev:prepare
          pnpm --filter sigma-ui-nuxt dev:components
          pnpm --filter sigma-ui-nuxt test:playground
          pnpm --filter sigma-ui-nuxt dev:build

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm -r --if-present --filter '!sigma-ui-nuxt' test
      - run: pnpm test:changelog
      - name: Changelogs use the release notes layout
        run: node scripts/changelog/run.mjs --check
