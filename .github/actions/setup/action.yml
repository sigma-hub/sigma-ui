name: Setup
description: Installs pnpm from the packageManager field, Node.js, and the workspace dependencies.

inputs:
  node-version:
    description: Node.js version to install. Defaults to the version in .nvmrc.
    required: false
    default: ''
  cache:
    description: Package manager whose store setup-node caches. Set it to an empty string to turn caching off.
    required: false
    default: pnpm

runs:
  using: composite

  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
        cache: ${{ inputs.cache }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
