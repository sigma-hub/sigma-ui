<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block preview</title>
    <script>
      (function () {
        var appearance = 'auto';
        try {
          var storedAppearance = localStorage.getItem('vitepress-theme-appearance');
          if (storedAppearance) {
            try {
              appearance = JSON.parse(storedAppearance);
            } catch (error) {
              appearance = storedAppearance;
            }
          }
        } catch (error) {}
        var dark = appearance === 'dark' || (appearance !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <style>
      html, body, #app { height: 100%; margin: 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
